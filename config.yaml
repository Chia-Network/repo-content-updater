# name: Should match the template filename and the property in github
# template_name the name of the template in the templates folder
# repo_path: The path in the repo to write the file to
# alternate_paths: Any paths listed here will be treated as the same file and renamed to the main repo_path
# retired_paths: Paths an earlier version of the file's bundle managed and no longer does. Writing the file deletes
#   them. Add a path here when it leaves the config; a renamed file goes in alternate_paths instead.

# Default files are applied to every non-archived, non-fork repo. They are
# adopt-only: only a file carrying its unique adoption marker line is updated.
# Add `!<name>` to a repo's managed-files property to opt that repo out of a
# default file; opting out of any file that writes the same repo path also opts
# out of the default.
default_files:
  - dependabot-actions
  - dep-review

# Groups allow inheriting a potentially evolving set of templates for a particular project type without needing to
# constantly update the list of files in the repo settings
# Just set `group:<groupname>` in the repo settings instead
groups:
  - name: base
    templates:
      - dep-review
      - commit-signing
      - node-runtime-check
      - dependabot

  - name: go
    templates:
      - go-makefile
      - dependabot

  - name: go-ci
    templates:
      - go-test

  # The workflow's companion_files bring in every script it needs.
  - name: dependency-artifact-review
    templates:
      - dependency-artifact-review

files:
  - name: commit-signing
    template_name: check-commit-signing.yml
    repo_path: .github/workflows/check-commit-signing.yml
    alternate_paths:
      - .github/workflows/check-commit-signing.yaml

  - name: node-runtime-check
    template_name: check-node-runtime.yml
    repo_path: .github/workflows/check-node-runtime.yml
    companion_files:
      - node-runtime-check-script
    alternate_paths:
      - .github/workflows/check-node-runtime.yaml

  - name: node-runtime-check-script
    template_name: check-node-runtime.sh
    repo_path: .github/scripts/check_node_runtime.sh

  - name: github-scripts-init
    template_name: github-scripts-init.py
    repo_path: .github/scripts/__init__.py

  - name: dependency-artifact-review
    template_name: dependency-artifact-review.yml
    repo_path: .github/workflows/dependency-artifact-review.yml
    adoption_marker: "repo-content-updater:dependency-artifact-review"
    requires_paths:
      - .github/workflows
    companion_files:
      - github-scripts-init
      - dependency-artifact-review-fetch
      - dependency-artifact-review-sources
      - dependency-artifact-review-lock
      - dependency-artifact-review-verdict
      - dependency-artifact-review-prompt
    alternate_paths:
      - .github/workflows/dependency-artifact-review.yaml

  - name: dependency-artifact-review-fetch
    template_name: dcr-fetch.py
    repo_path: .github/scripts/dcr_fetch.py

  - name: dependency-artifact-review-sources
    template_name: dcr-sources.py
    repo_path: .github/scripts/dcr_sources.py

  - name: dependency-artifact-review-lock
    template_name: dcr-lock.py
    repo_path: .github/scripts/dcr_lock.py

  - name: dependency-artifact-review-verdict
    template_name: dcr-verdict.py
    repo_path: .github/scripts/dcr_verdict.py

  - name: dependency-artifact-review-prompt
    template_name: dcr-prompt.md
    repo_path: .github/scripts/dcr_prompt.md

  - name: dep-review
    template_name: dependency-review.yml
    repo_path: .github/workflows/dependency-review.yml
    adoption_marker: "repo-content-updater:dependency-review"
    # Header lines of earlier renders of this template.
    previous_adoption_markers:
      - "Managed by repo-content-updater"
      - "This file is managed by the repo-content-updater project. Manual changes here will result in a PR to bring back"
    requires_paths:
      - .github/workflows
    alternate_paths:
      - .github/workflows/dependency-review.yaml
    # The legacy dependency cursor review bundle. dep-review is its default
    # replacement, so applying it removes the old workflow and its scripts.
    retired_paths:
      - .github/workflows/dependency-cursor-review.yml
      - .github/workflows/dependency-cursor-review.yaml
      - .github/workflows/dependabot-cursor-review.yml
      - .github/workflows/dependabot-cursor-review.yaml
      - .github/actions/trusted-git-path-checkout/action.yml
      - .github/scripts/dependency-cursor-review-trusted-scripts.paths
      - .github/scripts/formatter_runtime_bundle.py
      - .github/scripts/isolated_module_exec.py
      - .github/scripts/scripts_dir_disk_exec.py
      - .github/scripts/scripts_dir_path_scrub.py
      - .github/scripts/trusted_formatter_loader.py
      - .github/scripts/trusted_formatter_loader_cold_start.py
      - .github/scripts/malware_verdict_formatter.py
      - .github/scripts/upstream_malware_scan.sh
      - .github/scripts/dependency_update_coverage.py
      - .github/scripts/dependency_manifest_diff.py
      - .github/scripts/dependency_cursor_review_versions.py
      - .github/scripts/dependency_manifest_versions.py
      - .github/scripts/dependency_cursor_review_ecosystems.py
      - .github/scripts/dependency_cursor_review_upstream.py
      - .github/scripts/dependency_cursor_review_binding.py
      - .github/scripts/dependency_cursor_review_certificate.py
      - .github/scripts/dependency_manifest_go.py
      - .github/scripts/dependency_manifest_npm.py
      - .github/scripts/dependency_manifest_python.py
      - .github/scripts/dependency_manifest_lines.py
      - .github/scripts/dependency_pep508.py
      - .github/scripts/dependency_cursor_review_prompts.py
      - .github/scripts/dependency_cursor_review_combine_outputs.py
      - .github/scripts/dependency-cursor-review-dependabot-context.js
      - .github/scripts/dependency-cursor-review-post-comment.js
      - .github/scripts/dependency-cursor-review-target-pr.js
      - .github/scripts/upstream_malware_scan_lib.sh
      - .github/scripts/upstream_malware_scan_findings.sh
      - .github/scripts/upstream_release_checkout.sh

  - name: dependabot
    template_name: dependabot.yml
    repo_path: .github/dependabot.yml
    alternate_paths:
      - .github/dependabot.yaml

  - name: go-dependabot
    template_name: go-dependabot.yml
    repo_path: .github/dependabot.yml
    alternate_paths:
      - .github/dependabot.yaml

  - name: dependabot-actions
    template_name: dependabot.yml
    repo_path: .github/dependabot.yml
    adoption_marker: "repo-content-updater:dependabot"
    previous_adoption_markers:
      - "repo-content-updater:dependabot-actions"
    alternate_paths:
      - .github/dependabot.yaml
    requires_paths:
      - .github/workflows

  - name: go-makefile
    template_name: go-makefile
    repo_path: Makefile

  - name: go-test
    template_name: go-test.yml
    repo_path: .github/workflows/go-test.yml
    alternate_paths:
      - .github/go-test.yaml

  - name: prettier
    template_name: prettierrc.yml
    repo_path: .prettierrc.yml
    alternate_paths:
      - .prettierrc
      - .prettierrc.json
      - .prettierrc.json5
      - .prettierrc.yaml
      - .prettierrc.js
      - .prettierrc.js
      - .prettier.config.js
      - .prettierrc.mjs
      - .prettier.config.mjs
      - .prettierrc.cjs
      - .prettier.config.cjs
      - .prettierrc.toml

  - name: renovate-ips
    template_name: renovate-ips.json
    repo_path: renovate.json

  - name: security
    template_name: SECURITY.md
    repo_path: SECURITY.md

