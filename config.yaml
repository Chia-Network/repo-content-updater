# name: Should match the template filename and the property in github
# template_name the name of the template in the templates folder
# repo_path: The path in the repo to write the file to
# alternate_paths: Any paths listed here will be treated as the same file and renamed to the main repo_path
# retired_paths: Paths an earlier version of the file's bundle managed and no longer does. Writing the file deletes
#   them. Add a path here when it leaves the config; a renamed file goes in alternate_paths instead.

# Default files are applied to every non-archived, non-fork repo. They are
# adopt-only: only a file carrying its unique adoption marker line is updated.
# Add `!<name>` to a repo's managed-files property to opt that repo out of a
# default file; opting out of any file that writes the same repo path also opts
# out of the default.
default_files:
  - dependabot-actions
  - dependency-cursor-review

# Groups allow inheriting a potentially evolving set of templates for a particular project type without needing to
# constantly update the list of files in the repo settings
# Just set `group:<groupname>` in the repo settings instead
groups:
  - name: base
    templates:
      - dep-review
      - commit-signing
      - node-runtime-check
      - dependabot

  - name: go
    templates:
      - go-makefile
      - dependabot

  - name: go-ci
    templates:
      - go-test

  # The workflow's companion_files bring in every script it needs.
  - name: dependency-cursor-review
    templates:
      - dependency-cursor-review

files:
  - name: commit-signing
    template_name: check-commit-signing.yml
    repo_path: .github/workflows/check-commit-signing.yml
    alternate_paths:
      - .github/workflows/check-commit-signing.yaml

  - name: node-runtime-check
    template_name: check-node-runtime.yml
    repo_path: .github/workflows/check-node-runtime.yml
    companion_files:
      - node-runtime-check-script
    alternate_paths:
      - .github/workflows/check-node-runtime.yaml

  - name: node-runtime-check-script
    template_name: check-node-runtime.sh
    repo_path: .github/scripts/check_node_runtime.sh

  - name: dependency-cursor-review
    template_name: dependency-cursor-review.yml
    repo_path: .github/workflows/dependency-cursor-review.yml
    adoption_marker: "repo-content-updater:dependency-cursor-review"
    requires_paths:
      - .github/workflows
    aliases:
      - dependabot-cursor-review
    companion_files:
      - github-scripts-init
      - malware-verdict-formatter
      - upstream-malware-scan
      - dependency-update-coverage
      - dependency-manifest-diff
      - dependency-cursor-review-versions
      - dependency-cursor-review-ecosystems
      - dependency-cursor-review-upstream
      - dependency-cursor-review-binding
      - dependency-cursor-review-certificate
      - dependency-manifest-go
      - dependency-manifest-npm
      - dependency-manifest-python
      - dependency-manifest-lines
      - dependency-manifest-pep508
      - dependency-cursor-review-prompts
      - dependency-cursor-review-combine-outputs
      - dependency-cursor-review-dependabot-context
      - dependency-cursor-review-post-comment
      - dependency-cursor-review-target-pr
      - upstream-malware-scan-lib
      - upstream-malware-scan-findings
      - upstream-release-checkout
    alternate_paths:
      - .github/workflows/dependabot-cursor-review.yaml
      - .github/workflows/dependabot-cursor-review.yml
      - .github/workflows/dependency-cursor-review.yaml
    # Files earlier versions of this workflow installed and no longer use.
    # Writing the workflow deletes any that a repo still has.
    retired_paths:
      - .github/actions/trusted-git-path-checkout/action.yml
      - .github/scripts/dependency-cursor-review-trusted-scripts.paths
      - .github/scripts/formatter_runtime_bundle.py
      - .github/scripts/isolated_module_exec.py
      - .github/scripts/scripts_dir_disk_exec.py
      - .github/scripts/scripts_dir_path_scrub.py
      - .github/scripts/trusted_formatter_loader.py
      - .github/scripts/trusted_formatter_loader_cold_start.py

  - name: github-scripts-init
    template_name: github-scripts-init.py
    repo_path: .github/scripts/__init__.py

  - name: malware-verdict-formatter
    template_name: malware-verdict-formatter.py
    repo_path: .github/scripts/malware_verdict_formatter.py

  - name: upstream-malware-scan
    template_name: upstream-malware-scan.sh
    repo_path: .github/scripts/upstream_malware_scan.sh

  - name: dependency-update-coverage
    template_name: dependency-cursor-review-update-coverage.py
    repo_path: .github/scripts/dependency_update_coverage.py

  - name: dependency-manifest-diff
    template_name: dependency-cursor-review-manifest-diff.py
    repo_path: .github/scripts/dependency_manifest_diff.py

  - name: dependency-cursor-review-versions
    template_name: dependency-cursor-review-versions.py
    repo_path: .github/scripts/dependency_cursor_review_versions.py
    aliases:
      - dependency-manifest-versions
    alternate_paths:
      - .github/scripts/dependency_manifest_versions.py

  - name: dependency-cursor-review-ecosystems
    template_name: dependency-cursor-review-ecosystems.py
    repo_path: .github/scripts/dependency_cursor_review_ecosystems.py

  - name: dependency-cursor-review-upstream
    template_name: dependency-cursor-review-upstream.py
    repo_path: .github/scripts/dependency_cursor_review_upstream.py

  - name: dependency-cursor-review-binding
    template_name: dependency-cursor-review-binding.py
    repo_path: .github/scripts/dependency_cursor_review_binding.py

  - name: dependency-cursor-review-certificate
    template_name: dependency-cursor-review-certificate.py
    repo_path: .github/scripts/dependency_cursor_review_certificate.py

  - name: dependency-manifest-go
    template_name: dependency-cursor-review-manifest-go.py
    repo_path: .github/scripts/dependency_manifest_go.py

  - name: dependency-manifest-npm
    template_name: dependency-cursor-review-manifest-npm.py
    repo_path: .github/scripts/dependency_manifest_npm.py

  - name: dependency-manifest-python
    template_name: dependency-cursor-review-manifest-python.py
    repo_path: .github/scripts/dependency_manifest_python.py

  - name: dependency-manifest-lines
    template_name: dependency-cursor-review-manifest-lines.py
    repo_path: .github/scripts/dependency_manifest_lines.py

  - name: dependency-manifest-pep508
    template_name: dependency-cursor-review-manifest-pep508.py
    repo_path: .github/scripts/dependency_pep508.py

  - name: dependency-cursor-review-prompts
    template_name: dependency-cursor-review-prompts.py
    repo_path: .github/scripts/dependency_cursor_review_prompts.py

  - name: dependency-cursor-review-combine-outputs
    template_name: dependency-cursor-review-combine-outputs.py
    repo_path: .github/scripts/dependency_cursor_review_combine_outputs.py

  - name: dependency-cursor-review-dependabot-context
    template_name: dependency-cursor-review-dependabot-context.js
    repo_path: .github/scripts/dependency-cursor-review-dependabot-context.js

  - name: dependency-cursor-review-post-comment
    template_name: dependency-cursor-review-post-comment.js
    repo_path: .github/scripts/dependency-cursor-review-post-comment.js

  - name: dependency-cursor-review-target-pr
    template_name: dependency-cursor-review-target-pr.js
    repo_path: .github/scripts/dependency-cursor-review-target-pr.js

  - name: upstream-malware-scan-lib
    template_name: upstream-malware-scan-lib.sh
    repo_path: .github/scripts/upstream_malware_scan_lib.sh

  - name: upstream-malware-scan-findings
    template_name: upstream-malware-scan-findings.sh
    repo_path: .github/scripts/upstream_malware_scan_findings.sh

  - name: upstream-release-checkout
    template_name: upstream-release-checkout.sh
    repo_path: .github/scripts/upstream_release_checkout.sh

  - name: dep-review
    template_name: dependency-review.yml
    repo_path: .github/workflows/dependency-review.yml
    alternate_paths:
      - .github/workflows/dependency-review.yaml

  - name: dependabot
    template_name: dependabot.yml
    repo_path: .github/dependabot.yml
    alternate_paths:
      - .github/dependabot.yaml

  - name: go-dependabot
    template_name: go-dependabot.yml
    repo_path: .github/dependabot.yml
    alternate_paths:
      - .github/dependabot.yaml

  - name: dependabot-actions
    template_name: dependabot.yml
    repo_path: .github/dependabot.yml
    adoption_marker: "repo-content-updater:dependabot"
    previous_adoption_markers:
      - "repo-content-updater:dependabot-actions"
    alternate_paths:
      - .github/dependabot.yaml
    requires_paths:
      - .github/workflows

  - name: go-makefile
    template_name: go-makefile
    repo_path: Makefile

  - name: go-test
    template_name: go-test.yml
    repo_path: .github/workflows/go-test.yml
    alternate_paths:
      - .github/go-test.yaml

  - name: prettier
    template_name: prettierrc.yml
    repo_path: .prettierrc.yml
    alternate_paths:
      - .prettierrc
      - .prettierrc.json
      - .prettierrc.json5
      - .prettierrc.yaml
      - .prettierrc.js
      - .prettierrc.js
      - .prettier.config.js
      - .prettierrc.mjs
      - .prettier.config.mjs
      - .prettierrc.cjs
      - .prettier.config.cjs
      - .prettierrc.toml

  - name: renovate-ips
    template_name: renovate-ips.json
    repo_path: renovate.json

  - name: security
    template_name: SECURITY.md
    repo_path: SECURITY.md

variables:
  COMPANY_NAME: "Chia Network Inc."
  CGO_ENABLED: "0"
  MAKEFILE_WORKFLOWSCRIPT_TESTS: "0"
  DEPENDABOT_DENY_LICENSES: "AGPL-1.0-only, AGPL-1.0-or-later, AGPL-1.0-or-later, AGPL-3.0-or-later, GPL-1.0-only, GPL-1.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later"
  DEPENDABOT_GOMOD_PULL_REQUEST_LIMIT: "10"
  DEPENDABOT_GOMOD_REBASE_STRATEGY: "auto"
  DEPENDABOT_GOMOD_DIRECTORY: '["/"]'
  DEPENDABOT_GOMOD_REVIEWERS: '["cameroncooper", "emlowe"]'
  DEPENDABOT_GOMOD_GROUP_UPDATES: "1"
  DEPENDABOT_PIP_PULL_REQUEST_LIMIT: "10"
  DEPENDABOT_PIP_REBASE_STRATEGY: "auto"
  DEPENDABOT_PIP_DIRECTORY: '["/"]'
  DEPENDABOT_PIP_REVIEWERS: '["emlowe"]'
  DEPENDABOT_PIP_GROUP_UPDATES: "0"
  DEPENDABOT_ACTIONS_PULL_REQUEST_LIMIT: "10"
  DEPENDABOT_ACTIONS_REBASE_STRATEGY: "auto"
  DEPENDABOT_ACTIONS_DIRECTORIES: '["/", "/.github/actions/*"]'
  DEPENDABOT_ACTIONS_REVIEWERS: '["cameroncooper", "emlowe"]'
  DEPENDABOT_ACTIONS_GROUP_UPDATES: "0"
  DEPENDABOT_NPM_PULL_REQUEST_LIMIT: "10"
  DEPENDABOT_NPM_REBASE_STRATEGY: "auto"
  DEPENDABOT_NPM_DIRECTORY: '["/"]'
  DEPENDABOT_NPM_REVIEWERS: '["emlowe", "seeden"]'
  DEPENDABOT_NPM_GROUP_UPDATES: "0"
  DEPENDABOT_CARGO_DIRECTORY: '["/"]'
  DEPENDABOT_CARGO_PULL_REQUEST_LIMIT: "10"
  DEPENDABOT_CARGO_REBASE_STRATEGY: "auto"
  DEPENDABOT_CARGO_GROUP_UPDATES: "0"
  DEPENDENCY_REVIEW_ALLOW_DEPENDENCIES_LICENSES: pkg:pypi/pyinstaller
  DEPENDABOT_SWIFT_DIRECTORY: '["/"]'
  DEPENDABOT_SWIFT_PULL_REQUEST_LIMIT: "10"
  DEPENDABOT_SWIFT_REBASE_STRATEGY: "auto"
  DEPENDABOT_SWIFT_GROUP_UPDATES: "0"
  DEPENDABOT_DOCKER_DIRECTORIES: '["/"]'
  DEPENDABOT_DOCKER_PULL_REQUEST_LIMIT: "10"
  DEPENDABOT_DOCKER_REBASE_STRATEGY: "auto"
  DEPENDABOT_DOCKER_GROUP_UPDATES: "0"
  DEPENDABOT_TERRAFORM_DIRECTORIES: '["/"]'
  DEPENDABOT_TERRAFORM_PULL_REQUEST_LIMIT: "10"
  DEPENDABOT_TERRAFORM_REBASE_STRATEGY: "auto"
  DEPENDABOT_TERRAFORM_GROUP_UPDATES: "0"
  DEPENDABOT_NUGET_DIRECTORIES: '["/"]'
  DEPENDABOT_NUGET_PULL_REQUEST_LIMIT: "10"
  DEPENDABOT_NUGET_REBASE_STRATEGY: "auto"
  DEPENDABOT_NUGET_GROUP_UPDATES: "0"
  DEPENDABOT_CURSOR_MALWARE_WARN_ONLY: "1"
  DEPENDABOT_CURSOR_MALWARE_IOC_PATTERNS: '["axios@1\\.14\\.1", "axios@0\\.30\\.4", "plain-crypto-js", "sfrclak\\.com", "@shadanai/openclaw", "@shadanai/[a-z0-9._-]+", "2026\\.3\\.28-2", "2026\\.3\\.28-3", "2026\\.3\\.31-1", "2026\\.3\\.31-2"]'
