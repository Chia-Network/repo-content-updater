name: Go Test
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1
    steps:
      - name: Mark git directory safe
        uses: Chia-Network/actions/git-mark-workspace-safe@main

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*

      - name: Install malware scan tools
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y jq ripgrep uuid-runtime

      - name: Install yq
        run: |
          curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.47.2/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Test
        run: make test
