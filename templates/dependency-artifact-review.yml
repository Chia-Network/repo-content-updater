# inline with the upstream template, unless you add !dependency-artifact-review to the repo's managed-files property
# {{- if .ADOPTION_MARKER }}
# {{ .ADOPTION_MARKER }}
# {{- end }}
# Dependency Artifact Review workflow
#
# Opt-in review of the published artifacts for npm, PyPI, Go module and
# SHA-pinned GitHub Action updates. The prepare job fetches artifacts with a
# read-only token and no PR-head checkout. The agent job has only the Cursor
# key. The publish job is the required `dependency-review` check; its workflow
# name is distinct from the default "🚨 Dependency Review" workflow.
name: Dependency Artifact Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Dependabot PR number to analyze"
        required: true
        type: number
      updated_dependencies_json:
        description: "fetch-metadata updated-dependencies-json for the PR"
        required: false
        type: string

concurrency:
  group: ${{`{{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.pull_request.number }}`}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository_owner == 'Chia-Network' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{`{{ steps.pr.outputs.number }}`}}
    steps:
      - name: Checkout trusted review scripts
        uses: actions/checkout@v7
        with:
          ref: ${{`{{ github.event.repository.default_branch }}`}}
          path: .trusted-dcr-scripts
          sparse-checkout: |
            .github/scripts/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Copy trusted scripts out of the workspace
        shell: bash
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/trusted-dcr-scripts"
          mkdir -p "${dest}"
          cp -a .trusted-dcr-scripts/.github/scripts/. "${dest}/"
          test -s "${dest}/dcr_fetch.py"
          test -s "${dest}/dcr_prompt.md"

      - name: Resolve and validate target PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{`{{ github.token }}`}}
          DISPATCH_PR: ${{`{{ github.event.inputs.pr_number }}`}}
          PR_NUMBER: ${{`{{ github.event.pull_request.number }}`}}
        run: |
          set -euo pipefail
          number="${PR_NUMBER:-${DISPATCH_PR}}"
          case "$number" in
          '' | *[!0-9]*)
            echo "A numeric PR number is required." >&2
            exit 1
            ;;
          esac
          author="$(gh pr view "$number" --json author --jq '.author.login')"
          if [ "$author" != "dependabot[bot]" ]; then
            echo "PR author is not dependabot[bot]." >&2
            exit 1
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Fetch dependency metadata
        id: metadata
        if: github.event_name == 'pull_request'
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{`{{ github.token }}`}}

      - name: Collect PR diff
        shell: bash
        env:
          GH_TOKEN: ${{`{{ github.token }}`}}
          PR_NUMBER: ${{`{{ steps.pr.outputs.number }}`}}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pr-diff"
          gh pr diff "$PR_NUMBER" > "${RUNNER_TEMP}/pr-diff/pr.diff"
          test -s "${RUNNER_TEMP}/pr-diff/pr.diff"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Fetch published artifacts
        shell: bash
        env:
          UPDATED_DEPENDENCIES_JSON: >-
            ${{`{{ github.event_name == 'workflow_dispatch' && github.event.inputs.updated_dependencies_json || steps.metadata.outputs['updated-dependencies-json'] }}`}}
          PR_DIFF_PATH: ${{`{{ runner.temp }}`}}/pr-diff/pr.diff
          DCR_OUT: ${{`{{ runner.temp }}`}}/dcr-review
          DEPENDABOT_CURSOR_MALWARE_IOC_PATTERNS: >-
            {{ .DEPENDABOT_CURSOR_MALWARE_IOC_PATTERNS }}
        run: |
          set -euo pipefail
          python3 -I "${RUNNER_TEMP}/trusted-dcr-scripts/dcr_fetch.py"
          cp "${RUNNER_TEMP}/trusted-dcr-scripts/dcr_prompt.md" "${RUNNER_TEMP}/dcr-review/dcr_prompt.md"
          test -s "${RUNNER_TEMP}/dcr-review/meta.json"
          test -s "${RUNNER_TEMP}/dcr-review/changes.diff"

      - name: Upload review inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dcr-artifact-review-${{`{{ github.run_id }}`}}
          retention-days: 1
          if-no-files-found: error
          path: ${{`{{ runner.temp }}`}}/dcr-review

  agent:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download review inputs
        uses: actions/download-artifact@v8
        with:
          name: dcr-artifact-review-${{`{{ github.run_id }}`}}
          path: dcr-review

      - name: Install Cursor CLI
        shell: bash
        run: |
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT
          curl https://cursor.com/install -fsSL -o "$installer"
          if [ ! -s "$installer" ]; then
            echo "Cursor installer download was empty."
            exit 1
          fi
          bash "$installer"
          for bin_dir in "$HOME/.cursor/bin" "$HOME/.local/bin"; do
            if [ -d "$bin_dir" ]; then
              echo "$bin_dir" >> "$GITHUB_PATH"
              export PATH="$bin_dir:$PATH"
            fi
          done
          if ! command -v agent >/dev/null 2>&1; then
            echo "Could not locate 'agent' binary after Cursor CLI install."
            exit 1
          fi

      - name: Run Cursor agent
        timeout-minutes: 10
        shell: bash
        env:
          CURSOR_API_KEY: ${{`{{ secrets.CURSOR_API_KEY }}`}}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_TOKEN:-}" ] || [ -n "${GH_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN is set." >&2
            exit 1
          fi
          out="${RUNNER_TEMP}/dcr-agent"
          mkdir "$out"
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "CURSOR_API_KEY is not set; the review was skipped." >"${out}/agent_output.txt"
            exit 0
          fi
          stream_file="$(mktemp)"
          trap 'rm -f "$stream_file"' EXIT
          (cd dcr-review && agent -f --mode ask -p --output-format stream-json < dcr_prompt.md) > "$stream_file"
          python3 -I - "$stream_file" <<'PY' >"${out}/agent_output.txt"
          import json
          import sys

          result = ""
          final = ""
          with open(sys.argv[1], encoding="utf-8") as handle:
              for line in handle:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if not isinstance(event, dict):
                      continue
                  if event.get("type") == "assistant":
                      text = "".join(
                          block.get("text", "")
                          for block in event.get("message", {}).get("content", [])
                          if isinstance(block, dict)
                      )
                      if text:
                          final = text
                  elif event.get("type") == "result":
                      result = event.get("result", "")
          sys.stdout.write(result or final)
          PY

      - name: Upload agent output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dcr-artifact-agent-${{`{{ github.run_id }}`}}
          retention-days: 1
          if-no-files-found: error
          path: ${{`{{ runner.temp }}`}}/dcr-agent/agent_output.txt

  dependency-review:
    needs:
      - prepare
      - agent
    if: ${{`{{ always() && !cancelled() && needs.prepare.result != 'skipped' }}`}}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      MALWARE_WARN_ONLY: >-
        {{ .DEPENDABOT_CURSOR_MALWARE_WARN_ONLY }}
    steps:
      - name: Fail closed when prepare or agent failed
        if: ${{`{{ needs.prepare.result != 'success' || needs.agent.result != 'success' }}`}}
        run: |
          echo "prepare=${{`{{ needs.prepare.result }}`}} agent=${{`{{ needs.agent.result }}`}}" >&2
          exit 1

      - name: Checkout trusted verdict script
        uses: actions/checkout@v7
        with:
          ref: ${{`{{ github.event.repository.default_branch }}`}}
          path: .trusted-dcr-scripts
          sparse-checkout: |
            .github/scripts/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download review inputs
        uses: actions/download-artifact@v8
        with:
          name: dcr-artifact-review-${{`{{ github.run_id }}`}}
          path: dcr-review

      - name: Download agent output
        uses: actions/download-artifact@v8
        with:
          name: dcr-artifact-agent-${{`{{ github.run_id }}`}}
          path: dcr-agent-output

      - name: Decide and compose comment
        id: verdict
        shell: bash
        env:
          DCR_META: ${{`{{ github.workspace }}`}}/dcr-review/meta.json
          DCR_AGENT_OUTPUT: ${{`{{ github.workspace }}`}}/dcr-agent-output/agent_output.txt
          DCR_COMMENT: ${{`{{ github.workspace }}`}}/dcr-comment.md
          DCR_VERDICT_JSON: ${{`{{ github.workspace }}`}}/dcr-verdict.json
        run: |
          set -euo pipefail
          python3 -I .trusted-dcr-scripts/.github/scripts/dcr_verdict.py
          test -s dcr-comment.md

      - name: Post or update PR comment
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{`{{ needs.prepare.outputs.pr_number }}`}}
          COMMENT_PATH: ${{`{{ github.workspace }}`}}/dcr-comment.md
          REVIEW_MARKER: ${{`{{ steps.verdict.outputs.marker }}`}}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
            const marker = process.env.REVIEW_MARKER || '';
            const number = Number(process.env.PR_NUMBER || '0');
            if (!number) {
              core.setFailed('No PR number was resolved.');
              return;
            }
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: number,
              per_page: 100,
            });
            const ours = comments
              .filter((comment) => typeof comment.body === 'string' && comment.body.includes('<!-- dcr-artifact-review sha256:'))
              .sort((a, b) => new Date(a.created_at).getTime() - new Date(b.created_at).getTime());
            if (marker && ours.some((comment) => comment.body.includes(marker))) {
              core.info('This artifact review is already recorded.');
              return;
            }
            if (ours.length > 0) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: ours[ours.length - 1].id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body,
              });
            }

      - name: Set the check result
        if: ${{`{{ steps.verdict.outputs.conclusion != 'success' }}`}}
        run: |
          echo "Artifact review conclusion: ${{`{{ steps.verdict.outputs.conclusion }}`}}" >&2
          exit 1
